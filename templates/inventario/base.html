<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Gestión de Inventario
        {% endblock %}
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f7f7f7;
            color: #333;
        }

        header {
            background-color: #e75480;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .acciones {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .boton {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background-color: #e75480;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .boton:hover {
            opacity: 0.9;
        }

        .boton-secundario {
            background-color: #777;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        label {
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #fde2ea;
        }

        .mensaje {
            padding: 12px;
            margin-bottom: 15px;
            background-color: #e8f5e9;
            border-radius: 5px;
        }

        .error {
            color: #b00020;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Librería Lectura IMOS</h1>
    <p>Gestión de Inventario</p>
</header>

<main>

    {% if messages %}
        {% for message in messages %}
            <div class="mensaje">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
